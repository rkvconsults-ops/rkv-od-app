<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The OD Dashboard — RKV Consulting</title>
<script>if(location.hash.indexOf("mode=client")!==-1)document.documentElement.classList.add("client-mode");</script>
<link rel="stylesheet" href="styles.css">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#f6f4ef">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="OD Dashboard">
</head>
<body>
<div class="wrap">
  <header>
    <div class="kicker-row">
      <div class="kicker">RKV Consulting &middot; OD Practice &middot; v1.0</div>
      <span style="display:flex;gap:10px;align-items:center"><span class="sync-pill local" id="syncPill">Local only</span><a href="#/settings" class="gearlink" title="Settings" aria-label="Settings">&#9881;</a></span>
    </div>
    <h1 class="apptitle">The OD Dashboard</h1>
    <nav>
      <a href="#/" data-route="home">Clients</a>
      <a href="#/dashboard" data-route="dashboard">Dashboard</a>
      <a href="#/reference" data-route="reference">Reference</a>
      <a href="#/docs" data-route="docs">Documents</a>

    </nav>
  </header>

  <div id="app"><div class="empty">Loading&hellip;</div></div>

  <div class="copyright">&copy; 2026 Rahul K. Vimal &middot; RKV Consulting. All rights reserved. Internal delivery tool.</div>
</div>

<script src="store.js"></script>
<script src="sync.js"></script>
<script src="engine.js"></script>
<script src="app.js"></script>
<script>
  // documents.json loaded onto window.DOCS before App boots, so app.js can
  // stay synchronous when rendering the client-detail documents panel.
  fetch("documents.json").then(r => r.json()).then(d => { window.DOCS = d;
    return fetch("templates.json").then(r => r.json()); })
    .then(t => { window.TPL = t;
      return fetch("playbooks.json").then(r => r.json()); })
    .then(p => { window.PB = p; App.boot(); })
    .catch(() => { window.DOCS = window.DOCS || { byStep: {} }; window.TPL = window.TPL || { templates: {} }; window.PB = { issues: {} }; App.boot(); });
  // Offline shell -- lets the app open with no network (field use). Sync
  // stays queued until connectivity returns; nothing is lost either way.
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  }
</script>
</body>
</html>
